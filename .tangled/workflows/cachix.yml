---
when:
  - event: [push, manual, pull_request]
    branch: [main]
engine: microvm
image: nixos
dependencies: [cachix]
substituters:
  https://nix-community.cachix.org: nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
  https://meflove.cachix.org: meflove.cachix.org-1:daXeLaZBNNJOngNUDEoylRfvtai2uSFOqdg29fN+7N8=
steps:
  - name: Configure nix
    command: |
      export NIX_CONFIG="experimental-features = nix-command flakes
      access-tokens = github.com=$GH_TOKEN"
  - name: Configure cachix
    command: |
      cachix authtoken "$CACHIX_AUTH_TOKEN"
      cachix use meflove
      cachix use nix-community
  - name: Build and push
    command: |-
      bash .tangled/scripts/build-and-push.sh \
        airpods-helper \
        ani-cli-ru.api \
        ani-cli-ru.client \
        ani-cli-ru.uvicorn \
        aw-notify-rs \
        blanc \
        blueferry \
        blueferry-gtk \
        blueferry-qt \
        blueferry-quickshell \
        clipse \
        icloud-keychain.extension \
        icloud-keychain.icp \
        jj-hooks \
        librepods-noctalia \
        proton-linuwux \
        purple \
        tg-mtproto-cli \
        yazi-plugins.cba-preview \
        yazi-plugins.convert \
        yazi-plugins.djvu-preview \
        yazi-plugins.office \
        yazi-plugins.piper \
        yazi-plugins.torrent-preview \
        yazi-plugins.wl-clipboard \
        yot
