---
when:
  - event: [manual]
  - event: schedule
    schedule:
      - cron: 0 0 * * *
engine: microvm
image: nixos
dependencies: [git, openssh, devenv]
steps:
  - name: Configure nix
    command: |
      export NIX_CONFIG="experimental-features = nix-command flakes
      access-tokens = github.com=$GH_TOKEN"
  - name: Sync with default branch
    command: |-
      branch="${TANGLED_REPO_DEFAULT_BRANCH:-main}"
      if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
        git fetch --unshallow origin "$branch"
      else
        git fetch origin "$branch"
      fi
      git reset --hard FETCH_HEAD
  - name: Update flake.lock and devenv.lock
    command: |-
      nix flake update
      devenv update
  - name: Update packages
    command: |-
      nix run .#updater
  - name: Commit and push
    command: |-
      TANGLED_COMMIT_MESSAGE='chore(nix): update flake.lock, devenv.lock and packages' sh .tangled/scripts/commit-and-push.sh flake.lock devenv.lock packages
