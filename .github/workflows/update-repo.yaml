---
name: Update nix-packages and flake.lock
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nix-update:
    name: Run nix updater
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Find flake.nix directory
        id: flake-dir
        run: |
          FLAKE_DIR=$(dirname $(find . -name "flake.nix" -not -path "*/node_modules/*" | head -1))
          echo "dir=$FLAKE_DIR" >> $GITHUB_OUTPUT
      - name: Update flake.lock
        id: update
        run: nix flake update
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Update Nix devenv.lock
        id: update_devenv
        run: devenv update
      - name: Run updater
        working-directory: ${{ steps.flake-dir.outputs.dir }}
        run: nix run .#updater
      - name: Commit
        run: |-
          if ! git diff --quiet; then
            git config user.name "John Nix"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Flake.lock and devenv.lock update"
            git push
          fi
