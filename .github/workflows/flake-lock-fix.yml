---
name: Nix build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 2
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - name: Run build
        run: nix build
      - name: Fix hash mismatches
        if: failure() && github.event_name == 'pull_request'
        id: fix-hashes
        run: |-
          git stash --include-untracked
          git fetch --depth=1 origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "${{ github.event.pull_request.head.sha }}"
          determinate-nixd fix hashes --auto-apply .
          if ! git diff --quiet; then
            git config user.name "John Nix"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add --update --ignore-removal .
            git commit -m "flake.lock: Automatically fix Nix hashes"
            git push origin "$GITHUB_HEAD_REF"
          fi
          git checkout -
          git stash pop || true
